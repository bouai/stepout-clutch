# Render blueprint for the StepOut API.
#
# Deploy: push this repo to GitHub, then in the Render dashboard choose
# "New > Blueprint" and point it at the repo. Everything below is free-tier.
#
# Two caveats on the free tier, both of which matter for user testing:
#   1. The web service sleeps after ~15 minutes idle and takes ~50s to wake.
#      The first request after a nap will look like a timeout in the app.
#   2. The free Postgres instance expires after 30 days and must be recreated.
#
# Without the database below, the service falls back to SQLite on an ephemeral
# disk — every deploy and every restart wipes all data.

services:
  - type: web
    name: stepout-api
    runtime: python
    plan: free
    region: singapore
    rootDir: server
    buildCommand: pip install -r requirements.txt
    # Render injects $PORT; binding to a fixed port fails health checks.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATABASE_URL
        fromDatabase:
          name: stepout-db
          property: connectionString
      # Lock this down to specific origins if a web client is ever added.
      - key: ALLOWED_ORIGINS
        value: "*"
      # Auth runs in dev mode (magic link returned in the response, no email)
      # until this is set to a configured email sender. Setting it is the only
      # step between local login and real emailed magic links.
      - key: EMAIL_SENDER
        sync: false

databases:
  - name: stepout-db
    plan: free
    region: singapore
    databaseName: stepout
